 function App(){
  const [time,setTime]=useState(0);
  const [playing,setPlaying]=useState(false);
  const [speed,setSpeed]=useState(1);
  const frameRef=useRef(null);
  const lastRef=useRef(null);
  useEffect(()=>{
    if(!playing)return;
    lastRef.current=null;
    const tick=(stamp)=>{
      if(lastRef.current===null)lastRef.current=stamp;
      const delta=clamp((stamp-lastRef.current)/1000,0,.075);
      lastRef.current=stamp;
      setTime(old=>Math.min(DURATION,old+delta*speed));
      frameRef.current=requestAnimationFrame(tick);
    };
    frameRef.current=requestAnimationFrame(tick);
    return ()=>{if(frameRef.current!==null)cancelAnimationFrame(frameRef.current);frameRef.current=null};
  },[playing,speed]);
  useEffect(()=>{if(time>=DURATION&&playing)setPlaying(false)},[time,playing]);
  const seek=(v)=>{setPlaying(false);setTime(clamp(v,0,DURATION))};
  const go=(index)=>seek(chapters[clamp(index,0,chapters.length-1)].at);
  const toggle=()=>{if(playing){setPlaying(false)}else{if(time>=DURATION)setTime(0);setPlaying(true)}};
  const current=currentChapter(time);
  const previous=()=>go(Math.max(0,current-1));
  const next=()=>go(Math.min(chapters.length-1,current+1));

        E(DataCard,{tag:"Panjang fokus",value:fmt(MODEL.f)+" cm",detail:"Cermin cekung, f bertanda positif"}),
        E(DataCard,{tag:"Jarak bayangan",value:fmt(imageDistance)+" cm",detail:"Nyata, terletak di antara F dan C",highlight:true})
      ),
